basePath: /
definitions:
  internal_application_handler.PasswordUpdateRequest:
    properties:
      nova_senha:
        description: Nova senha a ser definida
        example: NovaSenha@123
        type: string
    type: object
  internal_application_handler.PerguntaOrdemUpdateRequest:
    properties:
      nova_ordem:
        example: 2
        type: integer
    type: object
  internal_application_handler.PerguntaReorderRequest:
    properties:
      pergunta_ids:
        example:
        - 12
        - 13
        - 14
        items:
          type: integer
        type: array
    type: object
  internal_application_handler.PesquisaStatusUpdateRequest:
    properties:
      status:
        example: Ativa
        type: string
    type: object
  internal_application_handler.StatusUpdateRequest:
    properties:
      status:
        description: Novo status do usuário
        example: Ativo
        type: string
    type: object
  internal_infrastructure_auth.ChangePasswordRequest:
    properties:
      nova_senha:
        description: Nova senha
        example: NovaSenha@123
        maxLength: 128
        minLength: 8
        type: string
      senha_atual:
        description: Senha atual
        example: SenhaAtual@123
        type: string
    required:
    - nova_senha
    - senha_atual
    type: object
  internal_infrastructure_auth.ForgotPasswordRequest:
    properties:
      email:
        description: Email para recuperação
        example: admin@empresa.com
        type: string
    required:
    - email
    type: object
  internal_infrastructure_auth.LoginRequest:
    properties:
      email:
        description: Email do usuário
        example: admin@empresa.com
        type: string
      senha:
        description: Senha em texto plano
        example: SenhaForte@123
        type: string
    required:
    - email
    - senha
    type: object
  internal_infrastructure_auth.RefreshTokenRequest:
    properties:
      token:
        description: Token JWT atual
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - token
    type: object
  internal_infrastructure_auth.ValidateTokenRequest:
    properties:
      token:
        description: Token JWT a ser validado
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - token
    type: object
  organizational-climate-survey_backend_internal_application_dto.BootstrapRequest:
    properties:
      cnpj:
        example: 12.345.678/0001-90
        type: string
      email:
        example: admin@techcorp.com
        type: string
      nome_admin:
        description: Dados do administrador
        example: Maria Souza
        type: string
      nome_fantasia:
        description: Dados da empresa
        example: Tech Corp
        type: string
      razao_social:
        example: Tech Corp LTDA
        type: string
      senha:
        example: SenhaForte@123
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.DashboardCreateRequest:
    properties:
      config_filtros:
        description: Configuração JSON de filtros (opcional)
        example: '{"setor":"RH"}'
        type: string
      id_pesquisa:
        description: Identificador da pesquisa associada (obrigatório)
        example: 10
        type: integer
      titulo:
        description: Título do dashboard (obrigatório)
        example: Dashboard Clima RH
        maxLength: 255
        minLength: 3
        type: string
    required:
    - id_pesquisa
    - titulo
    type: object
  organizational-climate-survey_backend_internal_application_dto.DashboardUpdateRequest:
    properties:
      config_filtros:
        description: Nova configuração de filtros (opcional)
        example: '{"periodo":"2026-Q1"}'
        type: string
      titulo:
        description: Novo título (opcional)
        example: Dashboard Executivo
        maxLength: 255
        minLength: 3
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.EmpresaCreateRequest:
    properties:
      cnpj:
        description: CNPJ formatado (obrigatório e com validação de tamanho)
        example: 12.345.678/0001-90
        type: string
      nome_fantasia:
        description: Nome comercial da empresa (obrigatório)
        example: Acme
        maxLength: 255
        minLength: 2
        type: string
      razao_social:
        description: Razão social registrada (obrigatória)
        example: Acme Industria LTDA
        maxLength: 255
        minLength: 2
        type: string
    required:
    - cnpj
    - nome_fantasia
    - razao_social
    type: object
  organizational-climate-survey_backend_internal_application_dto.EmpresaUpdateRequest:
    properties:
      nome_fantasia:
        description: Novo nome fantasia (opcional)
        example: Acme Brasil
        maxLength: 255
        minLength: 2
        type: string
      razao_social:
        description: Nova razão social (opcional)
        example: Acme Brasil LTDA
        maxLength: 255
        minLength: 2
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.GenerateTokenRequest:
    properties:
      fingerprint:
        description: Fingerprint do browser (opcional)
        example: f1a2b3c4d5
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.LogAuditoriaCreateRequest:
    properties:
      acao_realizada:
        description: Descrição resumida da ação executada
        example: Criacao de pesquisa
        maxLength: 255
        minLength: 3
        type: string
      detalhes:
        description: Detalhamento adicional da ação (opcional)
        example: Pesquisa trimestral criada com sucesso
        maxLength: 1000
        type: string
      endereco_ip:
        description: Endereço IP de origem (opcional e validado)
        example: 192.168.1.10
        type: string
      id_user_admin:
        description: Identificador do administrador responsável pela ação
        example: 1
        type: integer
    required:
    - acao_realizada
    - id_user_admin
    type: object
  organizational-climate-survey_backend_internal_application_dto.PerguntaCreateRequest:
    properties:
      id_pesquisa:
        description: Identificador da pesquisa associada (obrigatório)
        example: 10
        type: integer
      opcoes_resposta:
        description: Opções disponíveis para múltipla escolha ou escala (opcional)
        example: 1,2,3,4,5
        type: string
      ordem_exibicao:
        description: Posição de exibição da pergunta (obrigatório)
        example: 1
        minimum: 1
        type: integer
      texto_pergunta:
        description: Enunciado da pergunta (obrigatório)
        example: Como você avalia a comunicação interna?
        maxLength: 500
        minLength: 5
        type: string
      tipo_pergunta:
        description: Tipo da pergunta, restringido a opções válidas
        enum:
        - MultiplaEscolha
        - RespostaAberta
        - EscalaNumerica
        - SimNao
        example: EscalaNumerica
        type: string
    required:
    - id_pesquisa
    - ordem_exibicao
    - texto_pergunta
    - tipo_pergunta
    type: object
  organizational-climate-survey_backend_internal_application_dto.PerguntaUpdateRequest:
    properties:
      opcoes_resposta:
        description: Novas opções de resposta (opcional)
        example: Sim,Nao
        type: string
      ordem_exibicao:
        description: Nova ordem de exibição (opcional)
        example: 2
        minimum: 1
        type: integer
      texto_pergunta:
        description: Novo texto da pergunta (opcional)
        example: Você se sente reconhecido pelo trabalho?
        maxLength: 500
        minLength: 5
        type: string
      tipo_pergunta:
        description: Novo tipo da pergunta (opcional)
        enum:
        - MultiplaEscolha
        - RespostaAberta
        - EscalaNumerica
        - SimNao
        example: SimNao
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.PesquisaCreateRequest:
    properties:
      anonimato:
        description: Indica se as respostas são anônimas
        example: true
        type: boolean
      config_recorrencia:
        description: Definição de recorrência automática (opcional)
        example: mensal
        type: string
      data_abertura:
        description: Data de início no formato RFC3339 (opcional)
        example: "2026-01-10T09:00:00Z"
        type: string
      data_fechamento:
        description: Data de término no formato RFC3339 (opcional)
        example: "2026-01-31T23:59:59Z"
        type: string
      descricao:
        description: Descrição detalhada (opcional)
        example: Avaliação anual de clima organizacional
        maxLength: 1000
        type: string
      id_empresa:
        description: Identificador da empresa (obrigatório)
        example: 1
        type: integer
      id_setor:
        description: Identificador do setor vinculado (obrigatório)
        example: 2
        type: integer
      id_user_admin:
        description: Identificador do usuário administrador criador (obrigatório)
        example: 1
        type: integer
      status:
        description: Estado da pesquisa
        enum:
        - Rascunho
        - Ativa
        - Concluída
        - Arquivada
        example: Ativa
        type: string
      titulo:
        description: Título da pesquisa (obrigatório)
        example: Pesquisa de Clima 2026
        maxLength: 255
        minLength: 3
        type: string
    required:
    - id_empresa
    - id_setor
    - id_user_admin
    - status
    - titulo
    type: object
  organizational-climate-survey_backend_internal_application_dto.PesquisaUpdateRequest:
    properties:
      config_recorrencia:
        description: Atualização da configuração de recorrência (opcional)
        example: semanal
        type: string
      data_abertura:
        description: Nova data de abertura no formato RFC3339 (opcional)
        example: "2026-02-01T09:00:00Z"
        type: string
      data_fechamento:
        description: Nova data de fechamento no formato RFC3339 (opcional)
        example: "2026-02-07T23:59:59Z"
        type: string
      descricao:
        description: Nova descrição (opcional)
        example: Levantamento rápido de bem-estar
        maxLength: 1000
        type: string
      status:
        description: Novo status (opcional)
        enum:
        - Rascunho
        - Ativa
        - Concluída
        - Arquivada
        example: Concluída
        type: string
      titulo:
        description: Novo título (opcional)
        example: Pulso Semanal
        maxLength: 255
        minLength: 3
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.RespostaCreateRequest:
    properties:
      id_pergunta:
        description: Identificador da pergunta respondida
        example: 15
        type: integer
      valor_resposta:
        description: Conteúdo textual ou valor da resposta
        example: "5"
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.RetentionRequest:
    properties:
      retention_days:
        description: Quantidade de dias de retenção (mínimo 30, máximo 2555)
        example: 90
        maximum: 2555
        minimum: 30
        type: integer
    required:
    - retention_days
    type: object
  organizational-climate-survey_backend_internal_application_dto.SetorCreateRequest:
    properties:
      descricao:
        description: Descrição opcional, com limite de tamanho
        example: Setor responsável por gestão de pessoas
        maxLength: 500
        type: string
      id_empresa:
        description: Identificador da empresa associada
        example: 1
        type: integer
      nome_setor:
        description: Nome do setor (obrigatório e limitado)
        example: Recursos Humanos
        maxLength: 255
        minLength: 2
        type: string
    required:
    - id_empresa
    - nome_setor
    type: object
  organizational-climate-survey_backend_internal_application_dto.SetorUpdateRequest:
    properties:
      descricao:
        description: Nova descrição (opcional)
        example: Área estratégica de gestão de talentos
        maxLength: 500
        type: string
      nome_setor:
        description: Novo nome do setor (opcional)
        example: People Ops
        maxLength: 255
        minLength: 2
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.SubmitRespostasRequest:
    properties:
      respostas:
        description: Lista de respostas da pesquisa
        items:
          $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto.RespostaCreateRequest'
        type: array
      token_acesso:
        description: Token obtido via GenerateToken
        example: tok_abc123def456
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto.UsuarioAdministradorCreateRequest:
    properties:
      email:
        description: E-mail válido do administrador
        example: joao@empresa.com
        maxLength: 255
        type: string
      id_empresa:
        description: Identificador da empresa associada
        example: 1
        type: integer
      nome_admin:
        description: Nome completo do administrador
        example: Joao Silva
        maxLength: 255
        minLength: 2
        type: string
      senha:
        description: Senha em texto plano (antes do hash)
        example: SenhaForte@123
        maxLength: 128
        minLength: 8
        type: string
      status:
        description: Estado atual do usuário no sistema
        enum:
        - Ativo
        - Inativo
        - Pendente
        example: Ativo
        type: string
    required:
    - email
    - id_empresa
    - nome_admin
    - senha
    - status
    type: object
  organizational-climate-survey_backend_internal_application_dto.UsuarioAdministradorUpdateRequest:
    properties:
      email:
        description: Novo e-mail (opcional)
        example: maria@empresa.com
        maxLength: 255
        type: string
      nome_admin:
        description: Novo nome do administrador (opcional)
        example: Maria Oliveira
        maxLength: 255
        minLength: 2
        type: string
      status:
        description: Novo status (opcional)
        enum:
        - Ativo
        - Inativo
        - Pendente
        example: Inativo
        type: string
    type: object
  organizational-climate-survey_backend_internal_application_dto_response.APIResponse:
    properties:
      code:
        description: Codigo de erro para consumo de clientes
        example: BAD_REQUEST
        type: string
      data:
        description: Dados retornados, genéricos
      error:
        description: Mensagem de erro, se houver
        example: Parâmetro inválido
        type: string
      message:
        description: Mensagem opcional para o usuário
        example: Operação realizada com sucesso
        type: string
      success:
        description: Indica se a operação foi bem-sucedida
        example: true
        type: boolean
    type: object
  organizational-climate-survey_backend_internal_application_dto_response.PaginatedResponse:
    properties:
      code:
        example: ""
        type: string
      data: {}
      error:
        example: ""
        type: string
      message:
        example: Consulta realizada com sucesso
        type: string
      pagination:
        allOf:
        - $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.PaginationInfo'
        description: Informações de paginação
      success:
        example: true
        type: boolean
    type: object
  organizational-climate-survey_backend_internal_application_dto_response.PaginationInfo:
    properties:
      limit:
        description: Itens por página
        example: 20
        type: integer
      page:
        description: Página atual
        example: 1
        type: integer
      total:
        description: Total de itens
        example: 120
        type: integer
      total_pages:
        description: Total de páginas
        example: 6
        type: integer
    type: object
info:
  contact:
    email: backend@example.com
    name: Equipe Backend
  description: |
    API REST para gestão de empresas, pesquisas, dashboards, auditoria e submissões anônimas.

    Fluxo sugerido para clientes frontend:
    1) Autenticar em /auth/login
    2) Enviar token JWT no header Authorization: Bearer <token>
    3) Consumir endpoints protegidos em /api/v1
  license:
    name: Proprietary
  termsOfService: https://example.com/terms
  title: API de Pesquisa de Clima Organizacional
  version: "1.0"
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Valida a senha atual e altera para a nova senha informada.
      parameters:
      - description: Senha atual e nova senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_infrastructure_auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Alterar senha do usuário autenticado
      tags:
      - auth
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Inicia o fluxo de recuperação de senha para o email informado.
      parameters:
      - description: Email para recuperação
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_infrastructure_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
      summary: Solicitar recuperação de senha
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Realiza login com email e senha e retorna token JWT para uso nos
        endpoints protegidos.
      parameters:
      - description: Credenciais de acesso
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_infrastructure_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
      summary: Autenticar administrador
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Registra logout do usuário autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
      security:
      - BearerAuth: []
      summary: Encerrar sessão
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Valida o token atual e emite um novo token JWT.
      parameters:
      - description: Token atual
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_infrastructure_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
      summary: Renovar token JWT
      tags:
      - auth
  /api/v1/auth/validate:
    post:
      consumes:
      - application/json
      description: Valida um token JWT informado e retorna dados básicos do usuário
        associado.
      parameters:
      - description: Token para validação
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_infrastructure_auth.ValidateTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
      summary: Validar token JWT
      tags:
      - auth
  /api/v1/bootstrap:
    post:
      consumes:
      - application/json
      description: Cria empresa e primeiro administrador. Endpoint de bootstrap para
        configuração inicial.
      parameters:
      - description: Dados de bootstrap
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto.BootstrapRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto_response.APIResponse'
      summary: Inicializar sistema
      tags:
      - bootstrap
  /api/v1/dashboards:
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do dashboard
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/organizational-climate-survey_backend_internal_application_dto.DashboardCreateRequest'
      produces:
      - application/json
      responses:
        "201":
