services:
  db:
    image: postgres:16-alpine
    container_name: clima_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: clima_organizacional
      POSTGRES_USER: clima_user
      POSTGRES_PASSWORD: clima_password
    ports:
      - "5432:5432"
    volumes:
      - db_dev_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clima_user -d clima_organizacional"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: clima_backend_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: clima_user
      DB_PASS: clima_password
      DB_NAME: clima_organizacional
      DB_SSLMODE: disable
      JWT_SECRET: dev_jwt_secret_change_in_production
      APP_NAME: organizational-climate-survey
      APP_PORT: 8080
      APP_ENV: development
      FRONTEND_URL: http://localhost:3000
      HASH_SALT: dev_hash_salt_change_in_production
      REQUEST_BODY_LIMIT_BYTES: 5242880
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - qrcode_dev_data:/app/uploads/qrcodes

volumes:
  db_dev_data:
  qrcode_dev_data: