services:
  db:
    image: postgres:16-alpine
    container_name: clima_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-clima_organizacional}
      POSTGRES_USER: ${DB_USER:-clima_user}
      POSTGRES_PASSWORD: ${DB_PASS:-clima_password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clima_user} -d ${DB_NAME:-clima_organizacional}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clima_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
      APP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - qrcode_data:/app/uploads/qrcodes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db_data:
  qrcode_data: